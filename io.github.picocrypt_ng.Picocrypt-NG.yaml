app-id: io.github.picocrypt_ng.Picocrypt-NG
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: picocrypt-ng-launcher
finish-args:
  - --share=ipc
  # Expose X11 only when Wayland is unavailable.
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  # PCV3 admission reads effective memory limits; missing cgroup facts fail closed.
  - --filesystem=/sys/fs/cgroup:ro
  - --device=dri
build-options:
  prepend-path: /app/lib/sdk/golang/bin
  env:
    GOBIN: /app/bin
    GOROOT: /app/lib/sdk/golang
    GOTOOLCHAIN: local
    CGO_ENABLED: "1"
    GOPROXY: "off"
modules:
  - go-toolchain.yaml
  - name: picocrypt-ng
    buildsystem: simple
    build-commands:
      - test "$("$GOROOT/bin/go" env GOVERSION)" = go1.27.4
      - cd src && $GOROOT/bin/go build -tags flatpak,migrated_fynedo -mod=vendor -ldflags="-s -w" -o picocrypt-ng ./cmd/picocrypt
      - install -Dm00755 src/picocrypt-ng $FLATPAK_DEST/bin/picocrypt-ng
      - install -Dm00755 dist/flatpak/picocrypt-ng-launcher.sh $FLATPAK_DEST/bin/picocrypt-ng-launcher
      - ln -sf picocrypt-ng-launcher $FLATPAK_DEST/bin/picocrypt-ng-gui
      - install -Dm00644 images/key.svg $FLATPAK_DEST/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm00644 dist/linux/io.github.picocrypt_ng.Picocrypt-NG.desktop $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - install -Dm00644 picocrypt-ng-3.0.metainfo.xml $FLATPAK_DEST/share/metainfo/$FLATPAK_ID.metainfo.xml
      - install -Dm0644 LICENSE -t $FLATPAK_DEST/share/licenses/$FLATPAK_ID/
    sources:
      # Release 3.0 (1a057eeb1e63c3d15e83fca8d858bbecf82acd4f).
      - type: archive
        url: https://github.com/Picocrypt-NG/Picocrypt-NG/archive/refs/tags/3.0.tar.gz
        sha256: bdcd722816c3f92dd5453dca43a1f92a0e14f8ff03d747e78fb39e48ff4dccdd
      - type: file
        url: https://raw.githubusercontent.com/Picocrypt-NG/Picocrypt-NG/873693aafae0c974207ea0f3af47be1375b12e0e/dist/linux/io.github.picocrypt_ng.Picocrypt-NG.metainfo.xml
        sha256: 9fb6cc3c26232ae182d169c51ad095833539b8c3361a94665b575d54763c399a
        dest-filename: picocrypt-ng-3.0.metainfo.xml
      - go-mod-deps.yml
