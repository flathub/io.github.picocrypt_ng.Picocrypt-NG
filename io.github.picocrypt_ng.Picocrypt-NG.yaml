app-id: io.github.picocrypt_ng.Picocrypt-NG
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: picocrypt-ng-launcher
finish-args:
  - --share=ipc
  # Expose X11 only when Wayland is unavailable.
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  # PCV3 admission reads effective memory limits; missing cgroup facts fail closed.
  - --filesystem=/sys/fs/cgroup:ro
  - --device=dri
build-options:
  prepend-path: /app/lib/sdk/golang/bin
  env:
    GOBIN: /app/bin
    GOROOT: /app/lib/sdk/golang
    GOTOOLCHAIN: local
    CGO_ENABLED: "1"
    GOPROXY: "off"
modules:
  - go-toolchain.yaml
  - name: picocrypt-ng
    buildsystem: simple
    build-commands:
      - test "$("$GOROOT/bin/go" env GOVERSION)" = go1.27.3
      - cd src && $GOROOT/bin/go build -tags flatpak,migrated_fynedo -mod=vendor -ldflags="-s -w" -o picocrypt-ng ./cmd/picocrypt
      - install -Dm00755 src/picocrypt-ng $FLATPAK_DEST/bin/picocrypt-ng
      - install -Dm00755 dist/flatpak/picocrypt-ng-launcher.sh $FLATPAK_DEST/bin/picocrypt-ng-launcher
      - ln -sf picocrypt-ng-launcher $FLATPAK_DEST/bin/picocrypt-ng-gui
      - install -Dm00644 images/key.svg $FLATPAK_DEST/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm00644 dist/linux/io.github.picocrypt_ng.Picocrypt-NG.desktop $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - install -Dm00644 dist/linux/io.github.picocrypt_ng.Picocrypt-NG.metainfo.xml $FLATPAK_DEST/share/metainfo/$FLATPAK_ID.metainfo.xml
      - install -Dm0644 LICENSE -t $FLATPAK_DEST/share/licenses/$FLATPAK_ID/
    sources:
      # Unreleased local candidate. Remote retrieval requires publication first.
      - type: git
        url: https://github.com/Picocrypt-NG/Picocrypt-NG.git
        commit: 35b5824c68ebc2e5734e26c716e601d02ae2299e
      - type: file
        path: modules.txt
        dest: src/vendor
      - go-mod-deps.yml
